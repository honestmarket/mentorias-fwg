    var ult = real.slice(-1)[0];
    if(ult) h += '<div class="card"><div class="card-h"><h3>Última mentoria</h3></div><div class="card-b">'+pSess(ult)+'</div></div>';
    h += '</div><div class="stack"><div class="card"><div class="card-h"><h3>Suas entregas</h3><small>O que é papel seu</small></div><div class="card-b">'+(minhas.length?minhas.sort(function(a,b){ return (a.prazo||"9999")<(b.prazo||"9999")?-1:1; }).map(pTask).join(""):'<div class="empty">Nenhuma entrega pendente.</div>')+'</div></div></div></div>';
  } else if(PT.tab==="mentorias"){
    h += ses.length ? '<div class="tl">'+ses.map(function(x){ return '<div class="tli '+esc(x.status)+'">'+pSess(x, true)+'</div>'; }).join("")+'</div>' : '<div class="card"><div class="empty">O cronograma de mentorias ainda não foi definido.</div></div>';
  } else if(PT.tab==="plano"){
    h += '<p class="sub" style="margin:-6px 0 14px">O que é papel do seu mentor, o que é papel seu e o que vamos desenvolver em conjunto.</p><div class="tcols">'+["mentor","mentorado","conjunto"].map(function(r){
      var its = tk.filter(function(x){ return (x.resp||"conjunto")===r; }).sort(function(a,b){ var fa=a.status==="feito"?1:0, fb=b.status==="feito"?1:0; if(fa!==fb) return fa-fb; return (a.prazo||"9999")<(b.prazo||"9999")?-1:1; });
      return '<div class="tcol '+r+'"><div class="tcol-h"><b>'+(r==="mentor"?"Papel do mentor":r==="mentorado"?"Seu papel":"Em conjunto")+'</b><small>'+its.filter(function(x){ return x.status==="feito"; }).length+'/'+its.length+' concluídas</small></div><div class="tcol-b">'+(its.length?its.map(pTask).join(""):'<div class="empty" style="padding:14px">Nada aqui ainda.</div>')+'</div></div>';
    }).join("")+'</div>';
  } else if(PT.tab==="diagnostico"){
    var r = s.resumo;
    if(!r) h += '<div class="card"><div class="empty"><b>Diagnóstico em construção</b>Assim que o Canvas FWG for aplicado, o resultado aparece aqui.</div></div>';
    else {
      h += '<div class="cols"><div class="card"><div class="card-h"><h3>Maturidade da gestão por área</h3><small>Assessment de profissionalização</small></div><div class="card-b"><div class="mat">'+(r.areas||[]).map(function(a){ return '<div class="r"><span>'+esc(a.t)+'</span><div class="bar"><i style="width:'+(a.p||0)+'%"></i></div><b>'+(a.p==null?"—":fmtN(a.p)+"%")+'</b></div>'; }).join("")+'</div><p class="sub" style="margin-top:12px">Maturidade geral: <b style="color:var(--aqua)">'+(r.maturidade!=null?fmtN(r.maturidade)+"%":"—")+'</b></p></div></div>'+
        '<div class="card"><div class="card-h"><h3>Números do diagnóstico</h3></div><div class="card-b"><div class="nums"><div><b>'+(r.fatMes?brl(r.fatMes):"—")+'</b><span>Faturamento mensal</span></div><div><b>'+(r.lucroPct!=null?fmtN(r.lucroPct)+"%":"—")+'</b><span>Lucro líquido</span></div><div><b>'+(r.headcount?fmtN(r.headcount):"—")+'</b><span>Pessoas</span></div><div><b>'+(r.produtos||"—")+'</b><span>Produtos e serviços</span></div></div>'+((r.metas||[]).length?'<span class="lbl" style="margin-top:14px">Metas</span><ul style="margin:0;padding-left:18px;color:var(--aqua)">'+r.metas.map(function(m){ return '<li>'+esc(m.nome)+(m.prazo?' <span class="sub">· até '+esc(brDate(m.prazo))+'</span>':'')+'</li>'; }).join("")+'</ul>':'')+'</div></div></div>';
    }
  } else if(PT.tab==="materiais"){
    var fs = s.arquivos||[];
    h += fs.length ? '<div class="files">'+fs.map(function(f){
      var isLink = f.tipo==="link", href = isLink ? normUrl(f.url) : "/_blob/"+f.assetId, ss = f.sid ? (s.sessoes||[]).filter(function(z){ return z.id===f.sid; })[0] : null;
      var ext = isLink ? "" : ((f.nome||"").split(".").pop()||"ARQ").slice(0,4).toUpperCase();
      return '<div class="file"><div class="ic'+(isLink?" lk":"")+'">'+(isLink?ICON.link:esc(ext))+'</div><div class="fx"><a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(f.nome||"Arquivo")+'</a><span>'+esc([isLink?"Link":kb(f.size), ss?"Mentoria de "+brDate(ss.data):""].filter(Boolean).join(" · "))+'</span></div></div>';
    }).join("")+'</div>' : '<div class="card"><div class="empty">Nenhum material compartilhado ainda.</div></div>';
  }
  h += '<p class="sub" style="text-align:center;margin-top:30px;font-size:12px">Atualizado em '+esc(s.geradoEm?brDate(s.geradoEm.slice(0,10))+" às "+new Date(s.geradoEm).toTimeString().slice(0,5):"—")+' · Framework da Gestão</p></main>';
  P.innerHTML = h;
  P.querySelectorAll("[data-pt]").forEach(function(b){ b.onclick = function(){ PT.tab = b.dataset.pt; renderPortal(); }; });
  if($("plOut")) $("plOut").onclick = function(){ portalLogout(); };
  if($("pvClose")) $("pvClose").onclick = closePortal;
}
function pSess(x, full){
  var list = function(t, arr){ arr = (arr||[]).filter(Boolean); return arr.length ? '<div><h6>'+t+'</h6><ul>'+arr.map(function(v){ return '<li>'+esc(v)+'</li>'; }).join("")+'</ul></div>' : ''; };
  var body = x.status==="realizada" ? list("Temas discutidos", x.temasDiscutidos)+list("Temas executados", x.temasExecutados) : list("Pauta", x.pauta);
  var notas = full && x.notas && x.status==="realizada" ? '<div class="full" style="grid-column:1/-1"><h6>Resumo</h6><div style="white-space:pre-wrap;font-size:13.5px;color:var(--aqua)">'+esc(x.notas)+'</div></div>' : '';
  var link = x.status!=="realizada" && x.linkReuniao ? (/^https?:|^www\.|\.[a-z]{2,}\//i.test(x.linkReuniao) ? '<a class="btn sm" target="_blank" rel="noopener" href="'+esc(normUrl(x.linkReuniao))+'" style="margin-top:10px">'+ICON.link+'Entrar na reunião</a>' : '<div class="sub" style="margin-top:8px">Local: '+esc(x.linkReuniao)+'</div>') : '';
  var gu = x.status==="planejada" ? gcalUrl(x, "", true) : "";
  if(gu) link += '<a class="btn sm" target="_blank" rel="noopener" href="'+esc(gu)+'" style="margin-top:10px;margin-left:6px">'+GCAL_ICON+'Adicionar à minha agenda</a>';
  return '<div class="sess" style="cursor:default"><div class="h"><b>'+esc(x.titulo||"Mentoria")+'</b><span class="chip ss-'+esc(x.status)+'">'+esc(ST_S[x.status]||"")+'</span></div><div class="meta"><span>'+esc(longDate(x.data))+(x.hora?' · '+esc(faixa(x)):'')+(x.duracao?' · '+esc(fmtDur(x.duracao)):'')+'</span>'+(x.formato?'<span>'+(x.formato==="online"?"Online":"Presencial")+'</span>':'')+'</div>'+((body||notas)?'<div class="sum">'+body+notas+'</div>':'')+link+'</div>';
}
function pTask(x){
  var late = x.status!=="feito" && x.prazo && x.prazo<todayISO();
  var fs = x.id ? ((PT.snap && PT.snap.arquivos)||[]).filter(function(f){ return f.tid===x.id; }) : [];
  var ck = x.checklist||[], more = x.descricao || ck.length || fs.length;
  var head = '<span class="ck" style="cursor:default">'+(x.status==="feito"?ICON.check:"")+'</span><div style="flex:1;min-width:0"><div class="tt">'+esc(x.texto)+'</div><div class="tm"><span class="chip rp-'+esc(x.resp||"conjunto")+'" style="font-size:10.5px;padding:1px 8px">'+esc(RESP[x.resp||"conjunto"])+'</span>'+(x.assess?'<span class="ach">◆ '+esc(x.assess)+'</span>':'')+(x.status==="andamento"?'<span>Em andamento</span>':'')+(x.prazo?'<span class="'+(late?"late":"")+'">'+(late?"Atrasada · ":"Prazo ")+esc(brDate(x.prazo))+'</span>':'')+(ck.length?'<span>☑ '+ck.filter(function(c){ return c.ok; }).length+'/'+ck.length+'</span>':'')+(fs.length?'<span>📎 '+fs.length+'</span>':'')+(more?'<span class="pmore">Ver detalhes ▾</span>':'')+'</div>';
  if(!more) return '<div class="task '+esc(x.status||"afazer")+'" style="cursor:default">'+head+'</div></div>';
  var body = (x.descricao?'<p class="pdesc">'+esc(x.descricao)+'</p>':'')+
    (ck.length?'<ul class="pck">'+ck.map(function(c){ return '<li class="'+(c.ok?"ok":"")+'">'+(c.ok?"☑":"☐")+' '+esc(c.t)+'</li>'; }).join("")+'</ul>':'')+
    (fs.length?'<div class="pfs">'+fs.map(function(f){ var isImg = f.tipo!=="link" && /^image\//.test(f.contentType||""), href = f.tipo==="link" ? normUrl(f.url) : "/_blob/"+f.assetId; return isImg ? '<a href="'+esc(href)+'" target="_blank" rel="noopener" class="pimg"><img alt="'+esc(f.nome)+'" src="'+esc(href)+'"></a>' : '<a href="'+esc(href)+'" target="_blank" rel="noopener" class="gcl">'+esc(f.nome||"Arquivo")+'</a>'; }).join("")+'</div>':'');
  return '<details class="task ptask '+esc(x.status||"afazer")+'"><summary>'+head+'</div></summary><div class="pbody">'+body+'</div></details>';
}


/* =========================================================
   Inicialização
   ========================================================= */
readHash();
render();
var fallbackT = setTimeout(function(){ if(!dbApi && mode==="carregando"){ startLocal(); } }, 12000);
function startLocal(){ if(mode!=="carregando") return; mode="local"; localLoad(); COLS.forEach(localPublish); render(); }
function startPortal(){
  IS_MENTOR = false; mode = "portal";
  document.querySelector(".app").hidden = true; document.querySelector(".mobbar").hidden = true;
  var sess = null; try { sess = JSON.parse(sessionStorage.getItem("fwg-portal")||"null"); } catch(e){}
  if(!sess){ portalLogin(); return; }
  $("portal").hidden = false; $("portal").innerHTML = '<div class="empty" style="padding:80px 20px"><b>Abrindo o seu portal…</b></div>';
  getDoc("portal", sess.lookup).then(function(doc){
    if(!doc) return portalLogout();
    return importRaw(sess.key, ["decrypt"]).then(function(key){ return decryptObj(key, doc.iv, doc.ct); }).then(function(snap){ PT.lookup = sess.lookup; PT.snap = snap; renderPortal(); watchPortal(sess.lookup, sess.key); });
  }).catch(function(){ portalLogout("Sua sessão expirou. Entre novamente."); });
}
if(window.claude && typeof window.claude.use==="function"){
  Promise.all([window.claude.use("db").catch(function(){ return null; }), window.claude.use("user").catch(function(){ return null; })]).then(function(r){
    clearTimeout(fallbackT);
    var db = r[0], u = r[1]; userApi = u;
    return (u ? u.canEdit() : Promise.resolve(false)).then(function(ed){
      if(!db){ if(mode==="carregando") startLocal(); return; }
      dbApi = db;
      if(!ed){ startPortal(); return; }
      mode = "carregando"; startDb();
      if(window.FWG_HOSTED && $("hostUser")) $("hostUser").innerHTML = '<span style="opacity:.75">'+esc(window.FWG_HOSTED.email())+'</span><br><a href="#" onclick="window.FWG_HOSTED.trocarSenha();return false" style="color:inherit">Trocar senha</a> · <a href="#" onclick="window.FWG_HOSTED.sair();return false" style="color:inherit">Sair</a>';
      window.claude.use("downloads").then(function(d){ downloadsApi = d || null; }).catch(function(){});
      window.claude.use("mcp").then(function(m){ GC.api = m || null; GC.state = m ? "on" : "off"; render(false); }).catch(function(){});
      u.can("data.write").then(function(w){ if(w===false){ canWrite=false; bannerMsg="Você está com acesso somente leitura."; render(); } });
    });
  });
  window.claude.use("assets").then(function(a){ assetsApi = a || null; if(a && IS_MENTOR) render(); }).catch(function(){});
} else {
  clearTimeout(fallbackT); startLocal();
}
})();
</script>
