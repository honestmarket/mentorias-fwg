<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma de Mentorias FWG</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shim.js"></script>
<style>
/* ===== Login do mentor (versão hospedada) ===== */
#fwgAuth{position:fixed;inset:0;z-index:200;display:none;grid-template-columns:1.1fr 1fr;background:#fff;font-family:"Albert Sans",system-ui,sans-serif}
#fwgAuth.on{display:grid}
#fwgAuth .l{background:linear-gradient(150deg,#002F38 0%,#01414d 65%,#0b5866 130%);color:#F3F9FE;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
#fwgAuth .l .b{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.05;letter-spacing:.2px}#fwgAuth .l .b svg{width:40px;height:45px}
#fwgAuth .l h1{font-size:42px;line-height:1.08;margin:0 0 14px;font-weight:800}#fwgAuth .l h1 em{font-style:normal;color:#BA9239}
#fwgAuth .l p{opacity:.85;max-width:420px;font-size:15px;line-height:1.6}#fwgAuth .l small{opacity:.6}
#fwgAuth .r{display:flex;align-items:center;justify-content:center;padding:40px}#fwgAuth .x{width:100%;max-width:380px}
#fwgAuth h2{margin:0 0 6px;color:#002F38;font-size:24px}#fwgAuth .s{color:#5d7178;font-size:13.5px;margin:0 0 18px}
#fwgAuth label{display:block;font-size:11.5px;font-weight:700;color:#5d7178;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
#fwgAuth input{width:100%;box-sizing:border-box;border:1px solid #d5e2e8;border-radius:10px;padding:12px 13px;font-size:15px;font-family:inherit}
#fwgAuth input:focus{outline:none;border-color:#BA9239;box-shadow:0 0 0 3px rgba(186,146,57,.18)}
#fwgAuth button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:999px;background:#002F38;color:#F3F9FE;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
#fwgAuth button:disabled{opacity:.6}
#fwgAuth .lk{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}#fwgAuth .lk a{color:#002F38;font-weight:700;cursor:pointer;border-bottom:1px dashed #BA9239}
#fwgAuth .m{margin-top:14px;font-size:13px;border-radius:10px;padding:10px 12px;display:none}#fwgAuth .m.er{display:block;background:#fbe9e5;color:#a3402f}#fwgAuth .m.ok{display:block;background:#e6f3ec;color:#1d6b4b}
@media (max-width:820px){#fwgAuth{grid-template-columns:1fr}#fwgAuth .l{display:none}}

</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --white:#F3F9FE; --black:#10181E; --aqua:#002F38; --gold:#BA9239;
  --line:#d5e2e8; --muted:#5d7178; --card:#fff; --gold-soft:#f5ecd8; --aqua-soft:#e3eef1;
  --danger:#a3402f; --ok:#1d6b4b; --ok-soft:#e6f3ec;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:"Albert Sans",system-ui,sans-serif;background:var(--white);color:var(--black);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--aqua)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:radial-gradient(140% 90% at 100% 0%, #003a45 0%, var(--aqua) 45%, var(--black) 100%);color:var(--white);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.brand svg{width:30px;height:auto;flex:none}
.wordmark{line-height:1.02;font-size:15.5px}
.wordmark b{font-weight:800}
.wordmark small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:5px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:rgba(243,249,254,.78);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:rgba(243,249,254,.07);color:#fff}
.nav button.on{background:rgba(186,146,57,.16);color:var(--gold)}
.side h6{margin:0 0 6px;padding:0 12px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,249,254,.45);font-weight:700}
.mlist{display:flex;flex-direction:column;gap:2px}
.mlist button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:rgba(243,249,254,.8);padding:7px 10px;border-radius:9px;font-size:13.5px;text-align:left;font-weight:500}
.mlist button:hover{background:rgba(243,249,254,.07)}
.mlist button.on{background:rgba(243,249,254,.1);color:#fff}
.mlist .av{width:24px;height:24px;font-size:10px;border-radius:7px}
.mlist span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .foot{margin-top:auto;font-size:11.5px;color:rgba(243,249,254,.5);padding:0 8px}
.side .foot b{color:var(--gold);font-weight:700}
.main{min-width:0;padding:26px 34px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.crumbs{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{margin:4px 0 0;font-size:30px;line-height:1.1;font-weight:800;color:var(--aqua);letter-spacing:-.02em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.mobbar{display:none}

/* ---------- Buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--aqua);padding:9px 15px;border-radius:999px;font-weight:700;font-size:13.5px;transition:.12s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--aqua);border-color:var(--aqua);color:var(--white)}
.btn.pri:hover{background:#033f4b}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--aqua)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);background:#fbeae6}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn svg{width:15px;height:15px}
.inp,.sel,textarea.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;outline:0;transition:.12s}
.inp:focus,.sel:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(186,146,57,.15)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.45}
.inp::placeholder,textarea.inp::placeholder{color:#a9bcc2}
.lbl{display:block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.full{grid-column:1/-1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.span2{grid-column:span 2}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--aqua);color:var(--white)}

/* ---------- Cards / KPIs ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{margin:0;font-size:16px;color:var(--aqua);font-weight:800}
.card-h small{color:var(--muted);font-size:12.5px}
.card-b{padding:16px 20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:800;color:var(--aqua);line-height:1.1;letter-spacing:-.01em}
.kpi .k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.kpi.gold .v{color:var(--gold)}
.kpi.dark{background:var(--aqua);border-color:var(--aqua)}
.kpi.dark .v{color:var(--white)}
.kpi.dark .k{color:var(--gold)}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--aqua);font-size:15px;margin-bottom:4px}

/* ---------- Avatar / chips ---------- */
.av{width:44px;height:44px;border-radius:12px;background:var(--aqua);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;overflow:hidden;letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover;background:#fff}
.av.lg{width:64px;height:64px;font-size:21px;border-radius:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--aqua-soft);color:var(--aqua);white-space:nowrap}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-ativo{background:var(--ok-soft);color:var(--ok)}
.st-pausado{background:var(--gold-soft);color:#8a6a24}
.st-concluido{background:var(--aqua-soft);color:var(--aqua)}
.st-prospect{background:#eef0f2;color:#59656b}
.ss-planejada{background:var(--aqua-soft);color:var(--aqua)}
.ss-realizada{background:var(--ok-soft);color:var(--ok)}
.ss-cancelada{background:#fbeae6;color:var(--danger)}
.ss-remarcada{background:var(--gold-soft);color:#8a6a24}
.rp-mentor{background:var(--aqua);color:var(--gold)}
.rp-mentorado{background:var(--gold);color:var(--aqua)}
.rp-conjunto{background:var(--aqua-soft);color:var(--aqua)}

/* ---------- Mentee cards ---------- */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filters .inp{max-width:280px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.15s;text-align:left}
.mcard:hover{border-color:var(--gold);box-shadow:0 14px 30px -22px rgba(0,47,56,.5);transform:translateY(-1px)}
.mcard .top{display:flex;gap:12px;align-items:center}
.mcard .nm{font-weight:800;color:var(--aqua);font-size:16px;line-height:1.2}
.mcard .who{color:var(--muted);font-size:13px}
.mcard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.mcard .row b{color:var(--aqua);font-weight:700}
.bar{height:7px;background:var(--aqua-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:999px}
.bar.aq i{background:var(--aqua)}

/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .dt{width:54px;flex:none;text-align:center;border-radius:10px;background:var(--white);border:1px solid var(--line);padding:5px 0;line-height:1.1}
.li .dt b{display:block;font-size:18px;color:var(--aqua);font-weight:800}
.li .dt small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;color:var(--aqua);font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{font-size:12.5px;color:var(--muted)}
.li.click{cursor:pointer;border-radius:10px}
.li.click:hover{background:var(--white)}

/* ---------- Mentee env ---------- */
.mhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.mhead .info{flex:1;min-width:240px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:11px 14px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tabs button.on{color:var(--aqua);border-bottom-color:var(--gold)}
.tabs button .n{font-size:11px;background:var(--aqua-soft);color:var(--aqua);border-radius:999px;padding:1px 7px}

/* Journey stepper */
.steps{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.step{border-radius:12px;padding:12px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;position:relative}
.step .n{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.1em}
.step b{display:block;color:var(--aqua);font-size:14px;margin:2px 0 6px;line-height:1.25}
.step.done{background:var(--aqua);border-color:var(--aqua)}
.step.done b{color:var(--white)}
.step.doing{background:var(--gold-soft);border-color:#ead9b3}
.step .chip{font-size:11px}

/* Timeline */
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px}
.tli::before{content:"";position:absolute;left:-23px;top:16px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--aqua)}
.tli.realizada::before{background:var(--ok);border-color:var(--ok)}
.tli.cancelada::before{border-color:var(--danger)}
.tli.remarcada::before{border-color:var(--gold)}
.tli.today::after{content:"HOJE";position:absolute;left:-26px;top:-2px;font-size:8px;font-weight:800;color:var(--gold)}
.sess{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 16px;cursor:pointer;transition:.12s}
.sess:hover{border-color:var(--gold)}
.gcl{color:var(--aqua);font-weight:700;text-decoration:none;border-bottom:1px dashed var(--gold)}
.gcl:hover{color:var(--gold)}
.dlg.wide{max-width:1000px}
.nbadge{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(175px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:120px}
.kcol .kh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin:2px 4px 10px;font-size:13px;color:var(--aqua)}.kcol .kh span{font-size:11.5px;color:var(--muted)}
.k-ganho .kh b{color:var(--ok)}.k-perdido .kh b{color:var(--danger)}.k-ganho,.k-perdido{opacity:.92}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;display:grid;gap:7px}.kcard:hover{border-color:var(--gold)}
.kcard .kt{display:flex;gap:8px;align-items:center}.kcard .kt b{display:block;font-size:13.5px;color:var(--aqua);line-height:1.2}.kcard .kt small{font-size:11.5px;color:var(--muted)}.kcard .av{width:30px;height:30px;font-size:11px;flex:none}
.kcard .km{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}.kcard .kv{font-weight:800;color:var(--aqua);font-size:13px}.kcard .chip{font-size:10.5px;padding:1px 8px}
.kmv{display:flex;justify-content:space-between}.kmv button{border:1px solid var(--line);background:var(--white);border-radius:999px;font-size:11.5px;font-weight:700;color:var(--aqua);padding:2px 9px;cursor:pointer;font-family:inherit}.kmv button:hover{border-color:var(--gold)}
.kempty{text-align:center;color:var(--muted);font-size:12px;padding:16px 0}
.fu{font-size:11.5px;font-weight:600;color:var(--aqua)}.fu.late{color:var(--danger)}.fu.today{color:#9a6b12}.fu.none{color:var(--muted);font-weight:500}
.li .dt.late{background:#fbe9e5;color:var(--danger)}
.ps-rascunho{background:#eef0f2;color:#59656b}.ps-enviada{background:var(--gold-soft);color:#7a5a1e}.ps-aceita{background:var(--ok-soft);color:var(--ok)}.ps-recusada,.ps-vencida{background:#fbe9e5;color:var(--danger)}
.ke-ganho{background:var(--ok-soft);color:var(--ok)}.ke-perdido{background:#fbe9e5;color:var(--danger)}.ke-proposta,.ke-negociacao{background:var(--gold-soft);color:#7a5a1e}
.ptab{width:100%;border-collapse:collapse;font-size:13.5px}.ptab th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}.ptab td{padding:9px 8px;border-bottom:1px solid var(--line)}.ptab td .btn{margin-left:6px}
.fuadd{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px}
.fulist{margin-top:12px;display:grid;gap:8px}.fui{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.fud{flex:none;width:92px}.fud b{display:block;font-size:13px;color:var(--aqua)}.fud small{font-size:11.5px;color:var(--muted)}.fun{flex:1;font-size:13.5px;white-space:pre-wrap}.fui .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.mbar{display:grid;grid-template-columns:1fr 120px 46px;gap:10px;align-items:center;font-size:12.5px;margin:0 0 7px}.mbar i{display:block;height:8px;background:var(--aqua-soft);border-radius:9px;overflow:hidden}.mbar em{display:block;height:100%;background:var(--gold)}.mbar b{text-align:right;color:var(--aqua)}
.propedit .psec{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}.propedit h4{margin:0 0 10px;color:var(--aqua);font-size:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sugbox{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px}
.suga b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}.suga label{display:flex;gap:7px;align-items:flex-start;font-size:13px;margin:0 0 5px;cursor:pointer}.suga small{color:#9a6b12;font-weight:700}
.ppview{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;min-height:200px}.ppview img{width:100%;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 16px -10px rgba(0,0,0,.4)}
.ppload{grid-column:1/-1;height:200px;background:linear-gradient(90deg,var(--white),var(--aqua-soft),var(--white));background-size:200% 100%;animation:ppl 1.2s infinite;border-radius:12px}@keyframes ppl{to{background-position:-200% 0}}
@media (max-width:900px){.grid4{grid-template-columns:1fr 1fr}.fuadd{grid-template-columns:1fr 1fr}.sugbox{grid-template-columns:1fr}}
.li .tx span b.hr{color:var(--aqua);font-weight:700}
.gcw{background:#fbf1e3;border:1px solid #ead9b3;color:#7a5a1e;border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.45}
.gco{color:var(--ok);font-weight:700;font-size:13px}
.gcp{margin:0 0 18px}.gcp svg{width:26px;height:26px;color:var(--aqua);flex:none}
.gct{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.gcs{font-size:13px;color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:6px}.gcs svg{width:16px;height:16px}
.sess .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sess .h b{color:var(--aqua);font-size:15.5px;flex:1;min-width:180px}
.sess .meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
.sess .sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.sess .sum h6{margin:0 0 4px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.sess .sum ul{margin:0;padding-left:16px;font-size:13.5px;color:var(--aqua)}

/* Tasks */
.tcols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcol{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.tcol-h{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcol-h b{font-size:14px}
.tcol.mentor .tcol-h{background:var(--aqua);color:var(--white)}
.tcol.mentorado .tcol-h{background:var(--gold);color:var(--aqua)}
.tcol.conjunto .tcol-h{background:var(--aqua-soft);color:var(--aqua)}
.tcol-h small{font-size:11.5px;opacity:.8}
.tcol-b{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.task{border:1px solid var(--line);border-radius:11px;padding:9px 10px;display:flex;gap:9px;align-items:flex-start;background:#fff}
.task .ck{width:20px;height:20px;border-radius:6px;border:2px solid #b9ccd2;flex:none;margin-top:1px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;color:#fff}
.task .ck svg{width:12px;height:12px}
.task.feito .ck{background:var(--ok);border-color:var(--ok)}
.task.andamento .ck{border-color:var(--gold);background:var(--gold-soft)}
.task .tt{flex:1;min-width:0;font-size:13.5px;color:var(--aqua);font-weight:600;line-height:1.35;word-break:break-word}
.task.feito .tt{text-decoration:line-through;color:var(--muted);font-weight:500}
.task .tm{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.task .tm .late{color:var(--danger);font-weight:700}
.task .x{border:0;background:transparent;color:#9fb2b8;padding:0 2px;font-size:16px;line-height:1}
.task .x:hover{color:var(--danger)}
.addtask{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin-bottom:16px}
.addtask:has(.ass){grid-template-columns:minmax(200px,1fr) auto auto minmax(150px,240px) auto}
.task{cursor:pointer}.task:hover{border-color:var(--gold)}
.task .tm .ach{background:rgba(186,146,57,.14);color:#7a5a1e;border-radius:999px;padding:1px 8px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .td{font-size:12px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ckrow{display:flex;gap:8px;align-items:center}.ckrow input[type=checkbox]{width:17px;height:17px;flex:none;accent-color:var(--aqua)}
.tthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.tthumbs figure{margin:0;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.tthumbs img{display:block;width:100%;height:100px;object-fit:cover}
.tthumbs figcaption{font-size:11.5px;color:var(--muted);padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tthumbs .x{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.9);border:0;border-radius:50%;width:24px;height:24px;cursor:pointer;color:var(--aqua)}
.drop.over{border-color:var(--gold);background:rgba(186,146,57,.08)}
details.ptask{display:block}details.ptask summary{display:flex;gap:9px;align-items:flex-start;list-style:none;cursor:pointer}details.ptask summary::-webkit-details-marker{display:none}
.pmore{color:var(--gold);font-weight:700}details[open] .pmore{display:none}
.pbody{padding:8px 0 2px 31px}.pdesc{margin:0 0 8px;font-size:13px;color:var(--ink,#21343a);white-space:pre-wrap}
.pck{list-style:none;margin:0 0 8px;padding:0;font-size:13px;display:grid;gap:3px}.pck li.ok{color:var(--muted);text-decoration:line-through}
.pfs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pimg img{width:110px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}

/* Files */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.file{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:11px;align-items:center;background:#fff;min-width:0}
.file .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--aqua-soft);color:var(--aqua);font-size:10.5px;font-weight:800;flex:none;overflow:hidden}
.file .ic img{width:100%;height:100%;object-fit:cover}
.file .ic.lk{background:var(--gold-soft);color:#8a6a24}
.file .fx{flex:1;min-width:0}
.file .fx a,.file .fx b{display:block;font-weight:700;font-size:13.5px;color:var(--aqua);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.file .fx a:hover{text-decoration:underline}
.file .fx span{font-size:11.5px;color:var(--muted)}
.drop{border:1.5px dashed #b9ccd2;border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:13.5px;transition:.12s}
.drop.over{border-color:var(--gold);background:var(--gold-soft)}

/* Calendar */
.calh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.calh h3{margin:0;font-size:20px;color:var(--aqua);min-width:190px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.cal .dh{padding:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--white);border-bottom:1px solid var(--line)}
.cal .d{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .d:nth-child(7n){border-right:0}
.cal .d .n{font-size:12px;font-weight:700;color:var(--muted)}
.cal .d.out{background:#fafcfd}
.cal .d.out .n{color:#c2d0d5}
.cal .d.today .n{background:var(--gold);color:var(--aqua);border-radius:999px;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.ev{border:0;text-align:left;font-size:11.5px;font-weight:600;padding:3px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;display:block}
.ev.planejada{background:var(--aqua);color:var(--white)}
.ev.realizada{background:var(--ok-soft);color:var(--ok)}
.ev.cancelada{background:#fbeae6;color:var(--danger);text-decoration:line-through}
.ev.remarcada{background:var(--gold-soft);color:#8a6a24}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* Canvas embed */
.cvwrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--white)}
.cvwrap iframe{display:block;width:100%;border:0;min-height:800px}
.cvbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cvst{font-size:13px;color:var(--muted)}
.cvtools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.cvtools .btn svg{width:15px;height:15px}
.cvview{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fbf1e3;border:1px solid #ead9b3;border-radius:14px;padding:12px 16px;margin:0 0 12px}
.cvview b{display:block;color:var(--aqua)}.cvview span{font-size:13px;color:#7a5a1e}
.cvregs{margin:0 0 14px}.cvregs .li.on{background:rgba(186,146,57,.1);border-radius:12px}
.cvacts{display:flex;gap:6px;align-items:center;flex:none}
.cvcmp{margin:0 0 14px}
.cmpt{width:100%;border-collapse:collapse;font-size:14px}
.cmpt th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.cmpt td{padding:8px 10px;border-bottom:1px solid var(--line)}
.cmpt td:nth-child(n+2), .cmpt th:nth-child(n+2){text-align:right;white-space:nowrap}
.cmpt tr.main td{font-weight:700;color:var(--aqua);background:rgba(0,47,56,.04)}
.cmpt tr.sub td:first-child{padding-left:22px;color:var(--muted)}
.dup{color:var(--ok);font-weight:700}.ddn{color:#a3402f;font-weight:700}.dn0{color:var(--aqua);font-weight:600}.dz{color:var(--muted)}
.cmpi{margin-top:18px}.cmpi h4{margin:0 0 10px;color:var(--aqua)}
.cmpg{margin:0 0 12px}.cmpg h5{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.cmpg.up h5{color:var(--ok)}.cmpg.dn h5{color:#a3402f}.cmpg.ot h5{color:var(--muted)}
.cmpg ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cmpg li{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.cmpg li small{color:var(--muted)}.cmpg li span{margin-left:auto;font-weight:600;color:var(--aqua)}

/* Maturity mini */
.mat{display:flex;flex-direction:column;gap:7px}
.mat .r{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr 44px;gap:10px;align-items:center;font-size:13px}
.mat .r span{color:var(--aqua);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat .r b{text-align:right;color:var(--aqua)}
.mat .r.low span{color:var(--danger)}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.nums div{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.nums b{display:block;font-size:17px;color:var(--aqua);font-weight:800}
.nums span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- Drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,24,30,.5);z-index:40;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--white);z-index:41;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.4)}
.drawer.open{transform:none;visibility:visible;transition:transform .22s ease}
.dr-h{background:var(--aqua);color:var(--white);padding:16px 22px;display:flex;align-items:center;gap:12px}
.dr-h .t{flex:1;min-width:0}
.dr-h small{color:var(--gold);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.dr-h h2{margin:2px 0 0;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-h .x{border:0;background:rgba(243,249,254,.1);color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px}
.dr-b{flex:1;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.dr-f{padding:12px 22px;border-top:1px solid var(--line);background:#fff;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sec>h4{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--aqua);font-weight:800;display:flex;align-items:center;gap:8px;justify-content:space-between}
.sec>h4 small{font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:8px;align-items:center}
.item .inp{padding:7px 10px}
.item .x{border:0;background:transparent;color:#9fb2b8;font-size:17px;width:28px;height:28px;border-radius:8px;flex:none}
.item .x:hover{background:#fbeae6;color:var(--danger)}
.addline{border:1.5px dashed #b9ccd2;background:transparent;border-radius:9px;padding:7px;color:var(--aqua);font-weight:700;font-size:13px;margin-top:4px}
.addline:hover{border-color:var(--gold);background:var(--gold-soft)}
.priv{background:#fffaf0;border-color:#ead9b3}
.modal{position:fixed;inset:0;background:rgba(16,24,30,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.open{display:flex}
.dlg{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.dlg-h{padding:18px 22px 4px}
.dlg-h h3{margin:0;color:var(--aqua);font-size:19px}
.dlg-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.dlg-b{padding:14px 22px;display:flex;flex-direction:column;gap:14px}
.dlg-f{padding:12px 22px 18px;display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--aqua);color:var(--white);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none;border:1px solid var(--gold)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:var(--gold-soft);border:1px solid #ead9b3;color:#6f5419;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.banner.err{background:#fbeae6;border-color:#efc8bf;color:var(--danger)}

/* Financeiro */
.ptab{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.ptab th{text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 8px 8px;white-space:nowrap}
.ptab td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:middle}
.ptab td .inp{padding:7px 9px;font-size:13.5px;min-width:0}
.ptab td .inp[data-f=desc]{min-width:150px}
.ptab tfoot td{border-top:2px solid var(--aqua);font-weight:800;color:var(--aqua);padding:10px 8px}
.ptab.ro td{padding:10px 8px;white-space:nowrap}
.ptab tr.pr-pago td{background:#f4faf6}
.ptab tr.pr-atrasado td{background:#fdf4f2}
.pst{border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;white-space:nowrap;min-width:84px}
.pst.pago{background:var(--ok);color:#fff}
.pst.pendente{background:var(--aqua-soft);color:var(--aqua)}
.pst.atrasado{background:var(--danger);color:#fff}
.fchart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:200px}
.fcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-width:0}
.fbars{flex:1;width:100%;display:flex;gap:3px;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.fbars i{display:block;width:40%;max-width:22px;border-radius:5px 5px 0 0;min-height:1px}
.fbars i.p{background:#cfe0e5}
.fbars i.r{background:var(--ok)}
.fcol b{font-size:10.5px;color:var(--aqua);white-space:nowrap}
.fcol span{font-size:11px;color:var(--muted);font-weight:600}
.fcol.cur span{color:var(--gold);font-weight:800}

/* Portal do mentorado */
#portal{min-height:100vh;background:var(--white)}
.plog{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.plog-l{background:radial-gradient(120% 120% at 90% 0%, #003a45 0%, var(--aqua) 45%, var(--black) 100%);color:var(--white);padding:48px;display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;overflow:hidden}
.plog-l::after{content:"";position:absolute;right:-60px;bottom:-60px;width:420px;height:420px;opacity:.14;background-image:repeating-linear-gradient(45deg,transparent 0 46px,var(--gold) 46px 48px),repeating-linear-gradient(-45deg,transparent 0 46px,#7fa6ae 46px 48px);-webkit-mask-image:radial-gradient(circle,#000,transparent 70%);mask-image:radial-gradient(circle,#000,transparent 70%)}
.plog-l .brand.big svg{width:42px}
.plog-l .brand.big .wordmark{font-size:20px}
.plog-l h2{margin:10px 0 0;font-size:46px;line-height:1;font-weight:800;letter-spacing:-.025em}
.plog-l h2 span{color:var(--gold)}
.plog-l p{max-width:420px;color:rgba(243,249,254,.75);margin:0}
.plog-r{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:48px;max-width:460px;width:100%;margin:0 auto}
.plog-r h3{margin:0;font-size:26px;color:var(--aqua)}
.plerr{color:var(--danger);font-size:13.5px;font-weight:600;min-height:18px}
.phd{background:radial-gradient(120% 140% at 85% 0%, #003a45 0%, var(--aqua) 45%, var(--black) 100%);color:var(--white)}
.phd-in{max-width:1180px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.phd-id{justify-content:flex-start;padding-top:6px;padding-bottom:26px;gap:16px}
.pmain{max-width:1180px;margin:0 auto;padding:4px 28px 50px}
.pvbar{background:var(--gold);color:var(--aqua);font-weight:700;font-size:13.5px;padding:8px 18px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
  .tcols{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .mobbar{display:flex;align-items:center;gap:12px;background:var(--aqua);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:30}
  .mobbar button{border:0;background:rgba(243,249,254,.1);color:#fff;width:36px;height:36px;border-radius:10px;font-size:18px}
  .mobbar b{font-size:15px}
  .main{padding:18px 16px 50px}
  h1{font-size:24px}
  .grid2,.grid3,.grid4,.sess .sum{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .steps{grid-template-columns:1fr 1fr}
  .cal .d{min-height:70px;padding:3px}
  .ev{font-size:10px;padding:2px 3px}
  .addtask{grid-template-columns:1fr 1fr}
  .addtask .inp:first-child{grid-column:1/-1}
  .plog{grid-template-columns:1fr}
  .plog-l{padding:32px 24px}
  .plog-l h2{font-size:34px}
  .plog-r{padding:28px 22px}
  .phd-in,.pmain{padding-left:16px;padding-right:16px}
  .fchart{grid-template-columns:repeat(6,minmax(0,1fr));height:auto}
  .fcol{height:150px}
}
</style>
</head>
<body>
<div class="mobbar"><button id="mobMenu" aria-label="Menu">☰</button><b>Plataforma de Mentorias</b></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg viewBox="0 0 217 244" aria-hidden="true">
        <polygon fill="#BA9239" points="102,0 102,53 43,87 43,115 0,115 0,60"/>
        <polygon fill="#F3F9FE" points="115,0 217,60 217,115 174,115 174,87 115,53"/>
        <polygon fill="#F3F9FE" points="0,128 43,128 43,157 102,191 102,244 0,184"/>
        <polygon fill="#F3F9FE" points="120,128 217,128 217,184 115,244 115,191 174,160"/>
      </svg>
      <div class="wordmark">framework<br>da <b>gestão</b><small>Mentorias</small></div>
    </div>
    <nav class="nav" id="nav">
      <button data-go="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Painel</button>
      <button data-go="mentorados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>Mentorados</button>

function store(col, id, data){
  if(dbApi && mode!=="local"){
    var key = col+"/"+id;
    if(writing[key]){ pending[key] = data; return Promise.resolve(); }
    writing[key] = true;
    var run = function(d){
      return dbApi.collection(col).doc(id).set(d).then(function(){
        if(pending[key]){ var nx = pending[key]; delete pending[key]; return run(nx); }
      }, function(e){ throw e; });
    };
    return run(data).catch(function(e){ handleErr(e); }).then(function(){ delete writing[key]; });
  }
  local[col][id] = JSON.parse(JSON.stringify(data)); localSave(); if(COLS.indexOf(col)>-1) localPublish(col); render(false); return Promise.resolve();
}
function remove(col, id){
  if(dbApi && mode!=="local") return dbApi.collection(col).doc(id).delete().catch(handleErr);
  delete local[col][id]; localSave(); if(COLS.indexOf(col)>-1) localPublish(col); render(false); return Promise.resolve();
}
function getDoc(col, id){
  if(dbApi && mode!=="local") return dbApi.collection(col).doc(id).get().then(function(s){ return s.exists ? s.data() : null; });
  return Promise.resolve(local[col] && local[col][id] ? JSON.parse(JSON.stringify(local[col][id])) : null);
}
function strip(o){ var c = Object.assign({}, o); delete c.id; return c; }
function handleErr(e){
  var code = e && e.code;
  if(code==="invalid_argument"){ canWrite=false; showBanner("Seu acesso é somente leitura: as alterações não foram salvas.", true); }
  else if(code==="quota_exceeded"){ showBanner("O espaço de armazenamento da plataforma está cheio. Exclua arquivos ou registros antigos.", true); }
  else { toast("Não foi possível salvar agora. Tente de novo."); }
}
var bannerMsg = "", bannerErr = false;
function showBanner(m, err){ bannerMsg = m; bannerErr = !!err; render(); }

function startDb(){
  var timer = setTimeout(function(){ if(mode==="carregando"){ bannerMsg = "Os dados estão demorando para carregar. Verifique sua conexão."; render(); } }, 10000);
  COLS.forEach(function(col){
    dbApi.collection(col).onSnapshot(function(snap){
      D[col] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      loaded[col] = true;
      if(!snap.metadata.fromCache){ clearTimeout(timer); if(bannerMsg.indexOf("demorando")>-1) bannerMsg=""; }
      if(COLS.every(function(c){ return loaded[c]; })) mode = "db";
      scheduleRender();
    }, function(e){ clearTimeout(timer); if(e && e.code==="revoked"){ showBanner("Seu acesso a estes dados foi alterado. Recarregue a página.", true); } else { showBanner("Não foi possível carregar os dados agora.", true); } });
  });
}
var rT; function scheduleRender(){ clearTimeout(rT); rT = setTimeout(function(){ render(false); }, 30); }

/* =========================================================
   Seletores de dados
   ========================================================= */
function mentee(id){ return D.mentorados.filter(function(m){ return m.id===id; })[0]; }
function sessOf(mid){ return D.sessoes.filter(function(s){ return s.mid===mid; }).sort(sessSort); }
function sessSort(a,b){ var x=(a.data||"9999")+(a.hora||""), y=(b.data||"9999")+(b.hora||""); return x<y?-1:x>y?1:0; }
function tasksOf(mid){ return D.tarefas.filter(function(t){ return t.mid===mid; }); }
function filesOf(mid){ return D.arquivos.filter(function(f){ return f.mid===mid; }).sort(function(a,b){ return (b.criadoEm||"")<(a.criadoEm||"")?-1:1; }); }
function nextSess(mid){ var t=todayISO(); return sessOf(mid).filter(function(s){ return s.status==="planejada" && (s.data||"")>=t; })[0]; }
function lastSess(mid){ var r = sessOf(mid).filter(function(s){ return s.status==="realizada"; }); return r[r.length-1]; }
function menteeName(m){ return m ? (m.empresa || m.nome || "Sem nome") : "—"; }
function avatar(m, cls){ if(m && m.logoId) return '<div class="av '+(cls||"")+'"><img alt="" src="/_blob/'+esc(m.logoId)+'" onerror="this.parentNode.textContent=\''+esc(initials(menteeName(m)))+'\'"></div>'; return '<div class="av '+(cls||"")+'">'+esc(initials(menteeName(m)))+'</div>'; }
function sessCount(mid){ var ss = sessOf(mid); return {real: ss.filter(function(s){return s.status==="realizada";}).length, plan: ss.filter(function(s){return s.status==="planejada";}).length, total: ss.length}; }
function sessNumber(s){ var ss = sessOf(s.mid).filter(function(x){ return x.status!=="cancelada"; }); var i = ss.indexOf(s); return i>-1 ? i+1 : null; }

   ========================================================= */
var R = {view:"painel", mid:null, tab:"visao"};
function readHash(){
  var h = (location.hash||"").replace(/^#/,"");
  if(/^m-[a-z0-9]+$/i.test(h)){ R.view="mentorado"; if(R.mid!==h.slice(2)){ R.mid=h.slice(2); R.tab=R.nextTab||"visao"; } else if(R.nextTab) R.tab=R.nextTab; R.nextTab=null; }
  else if(["painel","mentorados","oportunidades","agenda","pendencias","financeiro"].indexOf(h)>-1){ R.view=h; R.mid=null; }
  else if(h==="portal" && IS_MENTOR){ R.view="painel"; R.mid=null; setTimeout(function(){ portalLogin(); }, 0); }
  else { R.view="painel"; R.mid=null; }
}
function go(h){ if(location.hash.replace(/^#/,"")===h){ readHash(); render(); } else location.hash = h; $("side").classList.remove("open"); window.scrollTo(0,0); }
window.addEventListener("hashchange", function(){ if(!IS_MENTOR) return; readHash(); render(); window.scrollTo(0,0); });
$("nav").addEventListener("click", function(e){ var b=e.target.closest("button[data-go]"); if(b) go(b.dataset.go); });
$("mobMenu").onclick = function(){ $("side").classList.toggle("open"); };

/* =========================================================
   Render principal
   ========================================================= */
var canvasFrameMid = null;
var deferred = false;
function render(force){
  if(!IS_MENTOR) return;
  if(force===false){
    var ae = document.activeElement;
    if(ae && $("main").contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.id!=="fq"){ deferred = true; renderSide(); autoPublish(); return; }
  }
  deferred = false;
  document.querySelectorAll("#nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.go===R.view || (R.view==="mentorado" && b.dataset.go==="mentorados")); });
  renderSide();
  var main = $("main");
  var keepCanvas = R.view==="mentorado" && R.tab==="canvas" && canvasFrameMid===R.mid && $("cvFrame");
  if(keepCanvas){ refreshCanvasHeader(); autoPublish(); return; }
  canvasFrameMid = null;
  var html = "";
  if(bannerMsg) html += '<div class="banner'+(bannerErr?" err":"")+'">'+esc(bannerMsg)+'</div>';
  if(mode==="carregando"){ main.innerHTML = html + '<div class="empty"><b>Carregando a plataforma…</b>Buscando mentorados, sessões e registros.</div>'; return; }
  if(mode==="local" && !bannerMsg) html += '<div class="banner">Modo de demonstração: os dados ficam guardados só neste navegador. Abra a plataforma pelo link do Claude para salvar com segurança.</div>';
  if(R.view==="painel") main.innerHTML = html + viewPainel();
  else if(R.view==="mentorados") main.innerHTML = html + viewMentorados();
  else if(R.view==="agenda") main.innerHTML = html + viewAgenda();
  else if(R.view==="pendencias") main.innerHTML = html + viewPendencias();
  else if(R.view==="financeiro") main.innerHTML = html + viewFinanceiro();
  else if(R.view==="oportunidades") main.innerHTML = html + viewOportunidades();
  else if(R.view==="mentorado"){
    var m = mentee(R.mid);
    if(!m){ main.innerHTML = html + '<div class="empty"><b>Mentorado não encontrado</b>Ele pode ter sido excluído. <br><br><button class="btn" data-go="mentorados">Ver mentorados</button></div>'; }
    else main.innerHTML = html + viewMentee(m);
  }
  bindMain();
  autoPublish();
}
$("main").addEventListener("focusout", function(){ if(deferred) setTimeout(function(){ if(deferred && !$("main").contains(document.activeElement)) render(false); }, 120); });
function renderSide(){
  var ob = $("oppBadge"); if(ob){ var nL = oportunidades().filter(function(m){ var f = funilOf(m); return FUNIL_ABERTO.indexOf(f.etapa)>-1 && f.proxFollow && daysTo(f.proxFollow)<=0; }).length; ob.hidden = !nL; ob.textContent = nL; }
  var act = D.mentorados.filter(function(m){ return (m.status||"ativo")==="ativo"; }).sort(function(a,b){ return menteeName(a).localeCompare(menteeName(b)); });
  $("sideList").innerHTML = act.length ? act.map(function(m){
    return '<button data-m="'+esc(m.id)+'" class="'+(R.mid===m.id?"on":"")+'">'+avatar(m)+'<span>'+esc(menteeName(m))+'</span></button>';
  }).join("") : '<div style="padding:4px 12px;font-size:12.5px;color:rgba(243,249,254,.5)">Nenhum mentorado ativo ainda.</div>';
  $("sideList").querySelectorAll("button[data-m]").forEach(function(b){ b.onclick=function(){ go("m-"+b.dataset.m); }; });
}

    '<div class="kpi"><div class="v">'+realMes+'</div><div class="k">Realizadas no mês</div></div>'+

  h += gcPanel();
  var first = new Date(cal.y, cal.m, 1), start = new Date(first); start.setDate(1 - first.getDay());
  var t = todayISO();
  h += '<div class="calh"><button class="btn sm" data-act="calPrev">‹</button><h3>'+(function(t){ return t.charAt(0).toUpperCase()+t.slice(1); })(first.toLocaleDateString("pt-BR",{month:"long", year:"numeric"}))+'</h3><button class="btn sm" data-act="calNext">›</button><button class="btn sm ghost" data-act="calHoje">Hoje</button></div>';

function viewPendencias(){
  var h = '<div class="topbar"><div><div class="crumbs">Pendências</div><h1>Pendências de todos os mentorados</h1><p class="sub">Encaminhamentos das mentorias e itens do plano de trabalho.</p></div></div>';
  h += '<div class="filters"><div class="seg" id="pfResp">'+[["todos","Todos"],["mentor","Mentor"],["mentorado","Mentorado"],["conjunto","Em conjunto"]].map(function(o){ return '<button data-v="'+o[0]+'" class="'+(pf.resp===o[0]?"on":"")+'">'+o[1]+'</button>'; }).join("")+'</div>'+
    '<div class="seg" id="pfSt">'+[["abertas","Abertas"],["atrasadas","Atrasadas"],["feito","Concluídas"]].map(function(o){ return '<button data-v="'+o[0]+'" class="'+(pf.st===o[0]?"on":"")+'">'+o[1]+'</button>'; }).join("")+'</div></div>';
  var t = todayISO();
  var list = D.tarefas.filter(function(x){
    if(pf.resp!=="todos" && x.resp!==pf.resp) return false;
    if(pf.st==="abertas") return x.status!=="feito";
    if(pf.st==="atrasadas") return x.status!=="feito" && x.prazo && x.prazo<t;
    return x.status==="feito";
  }).sort(function(a,b){ return (a.prazo||"9999")<(b.prazo||"9999")?-1:1; });
  if(!list.length) return h + '<div class="card"><div class="empty"><b>Nada por aqui</b>Nenhuma pendência com esse filtro.</div></div>';
  var byM = {};
  list.forEach(function(x){ (byM[x.mid] = byM[x.mid] || []).push(x); });
  h += '<div class="stack">'+Object.keys(byM).map(function(mid){
    var m = mentee(mid);
    return '<div class="card"><div class="card-h"><div style="display:flex;align-items:center;gap:10px">'+avatar(m)+'<h3>'+esc(menteeName(m))+'</h3></div><button class="btn sm" data-m="'+esc(mid)+'">Abrir ambiente</button></div><div class="card-b" style="display:flex;flex-direction:column;gap:8px">'+byM[mid].map(function(x){ return taskCard(x, false); }).join("")+'</div></div>';
  }).join("")+'</div>';
  return h;
}

  var c = sessCount(m.id), tk = tasksOf(m.id), open = tk.filter(function(x){ return x.status!=="feito"; }).length, fl = filesOf(m.id);
  var st = m.status||"ativo";
  var links = [];
  if(m.site) links.push('<a class="btn sm" target="_blank" rel="noopener" href="'+esc(normUrl(m.site))+'">'+ICON.link+'Site</a>');

function act(a, el, e){
  if(/^fin/.test(a) && a!=="finPrev" && a!=="finNext") return finAct(a, el);
  if(a==="finPrev"){ finMes -= 3; return render(); }
  if(a==="finNext"){ finMes += 3; return render(); }
  if(/^a[A-Z]/.test(a)) return acessoAct(a, el);
  if(["novaOpp","oppMove","fuNovo","oppSalvar","fuAdd","fuDel","propNova","propAbrir","propPdf"].indexOf(a)>-1) return oppAct(a, el);
  if(a==="gcToggle"){ gcSetAuto(el.checked); GC.msg=""; if(el.checked) toast("Sincronização automática ligada"); return render(); }
  if(a==="gcSyncAll") return gcSyncAll();
  if(a==="novoMentorado") return editMentee(null);
  if(a==="editMentorado") return editMentee(mentee(R.mid));
  if(a==="delMentorado") return delMentee(mentee(R.mid));
  if(a==="novaSessao") return newSession(el && el.dataset.mid || (R.view==="mentorado"?R.mid:null));
  if(a==="gerarSerie") return genSeries(mentee(R.mid));
  if(a==="calPrev"){ cal.m--; if(cal.m<0){ cal.m=11; cal.y--; } return render(); }
  if(a==="calNext"){ cal.m++; if(cal.m>11){ cal.m=0; cal.y++; } return render(); }
  if(a==="calHoje"){ var d=new Date(); cal.y=d.getFullYear(); cal.m=d.getMonth(); return render(); }
  if(a==="addTask"){
    var tx = ($("ntTxt").value||"").trim(); if(!tx){ $("ntTxt").focus(); return; }
    var id = uid();
    store("tarefas", id, {mid:R.mid, sid:"", texto:tx, resp:$("ntResp").value, prazo:$("ntPrazo").value||"", assess:$("ntAss").value||"na", status:"afazer", visivelMentorado:true, criadoEm:new Date().toISOString()}).then(function(){ var t0 = 0; (function op(){ if(D.tarefas.some(function(z){ return z.id===id; }) || t0++>30) openTask(id); else setTimeout(op, 50); })(); });
    return;
  }
  if(a==="taskCycle"){ e.stopPropagation(); var tid = el.closest(".task").dataset.t, x = D.tarefas.filter(function(z){ return z.id===tid; })[0]; if(!x) return; var nx = {afazer:"andamento", andamento:"feito", feito:"afazer"}[x.status||"afazer"]; var c = strip(x); c.status = nx; if(nx==="feito") c.concluidoEm = todayISO(); return store("tarefas", tid, c); }
  if(a==="taskDel"){ e.stopPropagation(); var tid2 = el.closest(".task").dataset.t, x2 = D.tarefas.filter(function(z){ return z.id===tid2; })[0]; return confirmDlg("Excluir pendência?", "“"+(x2?x2.texto:"")+"” será excluída.", "Excluir", function(){ remove("tarefas", tid2); }); }
  if(a==="upload"){ return pickFiles(R.mid, null); }
  if(a==="addLink"){ return addLinkDlg(R.mid, null); }
  if(a==="fileDel"){ e.preventDefault(); var fid = el.closest(".file").dataset.f; return delFile(fid); }
}
function cycleEtapa(i){

  var et = etapasOf(m).map(function(e){ return Object.assign({}, e); });

function confirmDlg(title, text, yes, fn){

    $("cNo").onclick = closeModal; $("cYes").onclick = function(){ closeModal(); fn(); };

function delMentee(m){
  if(!m) return;
  confirmDlg("Excluir "+menteeName(m)+"?", "O mentorado, as mentorias, as pendências, os registros de arquivos, o Canvas FWG, o financeiro e o acesso ao portal dele serão excluídos. Esta ação não pode ser desfeita.", "Excluir", function(){
    var ops = [];
    sessOf(m.id).forEach(function(s){ ops.push(["sessoes", s.id]); });
    tasksOf(m.id).forEach(function(x){ ops.push(["tarefas", x.id]); });
    filesOf(m.id).forEach(function(f){ ops.push(["arquivos", f.id]); });
    var ac = acessoOf(m.id); if(ac && ac.lookup && ac.ativo) ops.push(["portal", ac.lookup]);
    if(ac) ops.push(["acessos", m.id]); if(contratoOf(m.id)) ops.push(["contratos", m.id]);
    regsOf(m.id).forEach(function(r){ ops.push(["registros", r.id]); });
    ops.push(["canvas", m.id]); ops.push(["mentorados", m.id]);
    var run = function(i){ if(i>=ops.length) return Promise.resolve(); return remove(ops[i][0], ops[i][1]).then(function(){ return run(i+1); }); };
    var evs = sessOf(m.id).map(function(s){ return s.gcalEventId; }).filter(Boolean);
    run(0).then(function(){ toast("Mentorado excluído"); go("mentorados");
      if(evs.length && GC.api){ var k = 0; var g = function(){ if(k>=evs.length) return Promise.resolve(); return gcDelete(evs[k++]).then(g); }; g().then(function(){ toast("Mentorias removidas do Google Agenda"); }, function(e){ gcFail(e); }); }
    });
  });
}
function menteeSelect(sel){
  var list = D.mentorados.slice().sort(function(a,b){ return menteeName(a).localeCompare(menteeName(b)); });
  return '<select class="inp" id="sMid">'+list.map(function(m){ return '<option value="'+esc(m.id)+'"'+(m.id===sel?" selected":"")+'>'+esc(menteeName(m))+'</option>'; }).join("")+'</select>';
}

function genSeries(m){
  if(!m) return;
  openModal('<div class="dlg-h"><h3>Gerar cronograma recorrente</h3><p>Cria de uma vez todas as mentorias planejadas de '+esc(menteeName(m))+'.</p></div><div class="dlg-b"><div class="grid2">'+
    field("gIni","Primeira mentoria",m.inicio||todayISO(),{extra:'type="date"'})+field("gHora","Horário de início","",{extra:'type="time"'})+field("gFim","Horário de término","",{extra:'type="time"'})+
    '<div><label class="lbl" for="gFreq">Frequência</label><select class="inp" id="gFreq"><option value="7">Semanal</option><option value="14" selected>Quinzenal</option><option value="mes">Mensal</option></select></div>'+
    field("gQtd","Quantidade de mentorias",m.sessoesContratadas||"6",{extra:'type="number" min="1" max="60"'})+
    '<div><label class="lbl" for="gFmt">Formato</label><select class="inp" id="gFmt"><option value="online">Online</option><option value="presencial">Presencial</option></select></div>'+
    '</div><p class="sub" id="gPrev"></p></div><div class="dlg-f"><button class="btn" id="cNo">Cancelar</button><button class="btn pri" id="cYes">Gerar cronograma</button></div>', function(){
      function dates(){
        var d0 = parseISO($("gIni").value), q = Math.max(1, Math.min(60, +$("gQtd").value||1)), f = $("gFreq").value, out=[];
        if(!d0) return out;
        for(var i=0;i<q;i++){ var d = new Date(d0); if(f==="mes") d.setMonth(d0.getMonth()+i); else d.setDate(d0.getDate()+i*(+f)); out.push(toISO(d)); }
        return out;
      }
      function prev(){ var ds = dates(); $("gPrev").textContent = ds.length ? ds.length+" mentorias, de "+brDate(ds[0])+" a "+brDate(ds[ds.length-1])+"." : ""; }
      ["gIni","gFreq","gQtd"].forEach(function(id){ $(id).oninput = prev; $(id).onchange = prev; }); prev();
      bindFim("gHora", "gFim", m.duracaoPadrao);
      $("cNo").onclick = closeModal;
      $("cYes").onclick = function(){
        var ds = dates(); if(!ds.length) return;
        var base = sessOf(m.id).filter(function(s){ return s.status!=="cancelada"; }).length;
        var h = $("gHora").value, hf = $("gFim").value, fm = $("gFmt").value; if(!checkFim(h, hf)) return;
        var du = durOf(h, hf) ? String(durOf(h, hf)) : ""; if(!h) hf = "";
        closeModal();
        var made = [];
        var run = function(i){ if(i>=ds.length) return Promise.resolve(); var id = uid(), sd = {mid:m.id, titulo:"Mentoria "+(base+i+1), data:ds[i], hora:h, horaFim:hf, duracao:du, formato:fm, status:"planejada", pauta:[], temasDiscutidos:[], temasExecutados:[], notas:"", notasPrivadas:"", linkReuniao:"", criadoEm:new Date().toISOString()}; made.push([id, sd]); return store("sessoes", id, sd).then(function(){ return run(i+1); }); };
        run(0).then(function(){
          if(!gcOn() || !h){ toast(ds.length+" mentorias adicionadas ao cronograma"+(gcOn()&&!h?" (defina o horário para enviá-las ao Google Agenda)":"")); return; }
          toast(ds.length+" mentorias criadas. Enviando para o Google Agenda…");
          var ok = 0, j = 0;
          var g = function(){ if(j>=made.length || GC.state==="erro") return Promise.resolve(); var x = made[j++]; return gcSync(x[0], x[1], true).then(function(r){ if(r) ok++; return g(); }); };
          g().then(function(){ toast(ok===made.length ? ds.length+" mentorias adicionadas ao cronograma e ao Google Agenda" : ok+" de "+made.length+" mentorias foram para o Google Agenda"); });
        });
      };
    });
}

var TEXT_TYPES = {csv:"text/csv", md:"text/markdown", markdown:"text/markdown", json:"application/json", txt:"text/plain"};
function uploadErrMsg(err){
  var c = err && err.code;
  return c==="too_large" ? "Arquivo acima de 20 MB" : c==="unsupported_type" ? "Tipo de arquivo não aceito (use PDF, imagem, vídeo, CSV ou texto)" : c==="quota_or_state" ? "Espaço de armazenamento cheio" : c==="rate_limited" ? "Muitos envios seguidos, aguarde um pouco" : "Não foi possível enviar";
}
function pickFiles(mid, sid, tid){ var fi = $("fileIn"); fi.value=""; fi.onchange = function(){ if(fi.files.length) uploadFiles(fi.files, mid, sid, tid); }; fi.click(); }
function uploadFiles(files, mid, sid, tid){
  if(!assetsApi){ toast("Envio de arquivos indisponível aqui"); return; }
  var arr = Array.prototype.slice.call(files);
  var run = function(i){
    if(i>=arr.length){ if(sid) refreshDrawerFiles(); if(tid) refreshTaskFiles(); return; }
    var f = arr[i], ext = (f.name.split(".").pop()||"").toLowerCase(), opts = {};
    if(TEXT_TYPES[ext]) opts.type = TEXT_TYPES[ext]; else if(!f.type){ opts.type = ext==="pdf" ? "application/pdf" : undefined; if(!opts.type) delete opts.type; }
    toast("Enviando "+f.name+"…");
    assetsApi.upload(f, opts).then(function(r){
      return store("arquivos", uid(), {mid:mid, sid:sid||"", tid:tid||"", tipo:"arquivo", nome:f.name, assetId:r.id, contentType:r.contentType, size:r.sizeBytes, criadoEm:new Date().toISOString()}).then(function(){ toast(f.name+" enviado"); });
    }, function(err){ toast(f.name+": "+uploadErrMsg(err)); }).then(function(){ run(i+1); });
  };
  run(0);
}
function delFile(fid){
  var f = D.arquivos.filter(function(z){ return z.id===fid; })[0]; if(!f) return;
  confirmDlg("Excluir "+(f.tipo==="link"?"link":"arquivo")+"?", "“"+(f.nome||"")+"” será excluído"+(f.tipo==="link"?"":" definitivamente")+".", "Excluir", function(){
    var p = remove("arquivos", fid);
    if(f.tipo!=="link" && f.assetId && assetsApi){ p = p.then(function(){ return assetsApi.delete(f.assetId).catch(function(){}); }); }
    p.then(function(){ toast("Excluído"); if(f.sid) refreshDrawerFiles(); if(f.tid) refreshTaskFiles(); });
  });
}

function backupDlg(){
  openModal('<div class="dlg-h"><h3>Backup dos dados</h3><p>Exporte tudo (mentorados, mentorias, plano, canvas e registros, arquivos, financeiro e acessos do portal) em um arquivo, ou importe um backup gerado pela outra versão da plataforma.</p></div><div class="dlg-b">'+

    '<p class="sub" id="bkMsg" style="margin:12px 0 0">Os arquivos enviados (PDFs, imagens) não entram no backup: apenas os registros e links.</p><input type="file" id="bkFile" accept=".json,application/json" hidden></div>'+
    '<div class="dlg-f"><button class="btn" id="cNo">Fechar</button></div>', function(){
      $("cNo").onclick = closeModal;
      $("bkExp").onclick = function(){ exportBackup(); };
      $("bkImp").onclick = function(){ var f = $("bkFile"); f.value = ""; f.onchange = function(){ if(f.files[0]) importBackup(f.files[0]); }; f.click(); };
    });
}
function exportBackup(){
  var out = {app:"mentorias-fwg", v:1, exportadoEm:new Date().toISOString(), cols:{}};
  COLS.forEach(function(c){ out.cols[c] = {}; (D[c]||[]).forEach(function(d){ out.cols[c][d.id] = strip(d); }); });
  out.cols.canvas = {}; out.cols.portal = {};
  var jobs = D.mentorados.map(function(m){ return getDoc("canvas", m.id).then(function(d){ if(d) out.cols.canvas[m.id] = d; }); })
    .concat(D.acessos.filter(function(a){ return a.lookup; }).map(function(a){ return getDoc("portal", a.lookup).then(function(d){ if(d) out.cols.portal[a.lookup] = d; }); }));
  if($("bkMsg")) $("bkMsg").textContent = "Preparando o backup…";
  Promise.all(jobs).then(function(){
    var name = "backup-mentorias-fwg-"+todayISO()+".json", json = JSON.stringify(out);
    var done = function(){ if($("bkMsg")) $("bkMsg").textContent = "Backup gerado: "+name; };
    if(downloadsApi) downloadsApi.save({filename:name, data:json}).then(done, function(e){ if(e && e.code!=="declined") toast("Não foi possível salvar o backup"); });
    else { try { var url = URL.createObjectURL(new Blob([json], {type:"application/json"})), a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000); done(); } catch(e){ toast("Não foi possível salvar o backup"); } }
  }, function(){ toast("Não foi possível ler todos os dados agora"); });
}
function importBackup(file){
  var rd = new FileReader();
  rd.onload = function(){
    var b; try { b = JSON.parse(rd.result); } catch(e){ toast("Arquivo inválido"); return; }
    if(!b || b.app!=="mentorias-fwg" || !b.cols){ toast("Este arquivo não é um backup da Plataforma de Mentorias"); return; }
    var ops = []; Object.keys(b.cols).forEach(function(c){ Object.keys(b.cols[c]||{}).forEach(function(id){ ops.push([c, id, b.cols[c][id]]); }); });
    var nm = Object.keys(b.cols.mentorados||{}).length;
    confirmDlg("Importar backup de "+brDate((b.exportadoEm||"").slice(0,10))+"?", nm+" mentorado"+(nm!==1?"s":"")+" e "+ops.length+" registros no total. Registros com o mesmo identificador serão substituídos pelos do backup; os demais continuam como estão.", "Importar", function(){
      var i = 0; toast("Importando…");
      var run = function(){ if(i>=ops.length) return Promise.resolve(); var o = ops[i++]; return store(o[0], o[1], o[2]).then(function(){ if(i%10===0 && $("bkMsg")) $("bkMsg").textContent = "Importando "+i+" de "+ops.length+"…"; return run(); }); };
      run().then(function(){ toast("Backup importado: "+ops.length+" registros"); render(true); });
    });
  };
  rd.readAsText(file);
}

function followTag(f){
  if(!f || !f.proxFollow) return '<span class="fu none">Sem follow-up agendado</span>';
  var d = daysTo(f.proxFollow);
  if(d<0) return '<span class="fu late">Follow-up atrasado · '+esc(brDate(f.proxFollow))+'</span>';
  if(d===0) return '<span class="fu today">Follow-up hoje</span>';
  return '<span class="fu">Follow-up '+(d===1?"amanhã":"em "+esc(brDate(f.proxFollow)))+'</span>';
}
function saveFunil(m, patch){
  var c = strip(m); c.funil = Object.assign({}, funilOf(m)||{etapa:"lead"}, patch, {atualizadoEm:new Date().toISOString()});
  if(patch.etapa==="ganho" && c.status==="prospect") c.status = "ativo";
  if(patch.etapa && patch.etapa!=="ganho" && patch.etapa!=="perdido" && !c.status) c.status = "prospect";
  return store("mentorados", m.id, c);
}

function oppAct(a, el){
  var m = el && el.dataset.mid ? mentee(el.dataset.mid) : (R.view==="mentorado" ? mentee(R.mid) : null);
  if(a==="novaOpp") return novaOportunidade();
  if(a==="oppMove"){ var to = el.dataset.to; if(!m) return; if(to==="ganho") return confirmDlg("Marcar "+menteeName(m)+" como ganho?", "A oportunidade sai do funil em aberto e o mentorado passa para o status Ativo.", "Marcar como ganho", function(){ saveFunil(m, {etapa:"ganho", ganhoEm:todayISO()}).then(function(){ toast("Oportunidade ganha!"); }); }); return saveFunil(m, {etapa:to}).then(function(){ toast(menteeName(m)+" · "+FUNIL_N[to]); }); }
  if(a==="fuNovo"){ if(m) followDlg(m); return; }
  if(a==="oppSalvar"){
    if(!m) return; var b = $("oEt").querySelector("button.on"), val = $("oVal").value.trim();
    var patch = {etapa: b ? b.dataset.v : "lead", valor: val ? money2(parseBR(val)) : "", origem:$("oOri").value.trim(), proxFollow:$("oProx").value, proxAcao:$("oAcao").value.trim(), motivo:$("oMot").value.trim(), notas:$("oNot").value};
    if(patch.etapa==="ganho" && funilOf(m) && funilOf(m).etapa!=="ganho") patch.ganhoEm = todayISO();
    return saveFunil(m, patch).then(function(){ toast(patch.etapa==="ganho" && m.status==="prospect" ? "Oportunidade ganha · mentorado agora está Ativo" : "Oportunidade salva"); });
  }
  if(a==="fuAdd"){
    if(!m) return; var nota = $("fuNota").value.trim(); if(!nota){ $("fuNota").focus(); return; }
    var f = funilOf(m)||{etapa:"lead"}, x = {id:uid(), data:$("fuData").value||todayISO(), canal:$("fuCanal").value, nota:nota};
    return saveFunil(m, {etapa:f.etapa||"lead", followups:(f.followups||[]).concat([x]), ultimoContato:x.data}).then(function(){ toast("Follow-up registrado"); });
  }
  if(a==="fuDel"){ if(!m) return; var f2 = funilOf(m)||{}; var id = el.dataset.fu; return confirmDlg("Excluir este follow-up?", "O registro do contato será removido do histórico.", "Excluir", function(){ saveFunil(m, {followups:(f2.followups||[]).filter(function(z){ return z.id!==id; })}); }); }
  if(a==="propNova"){ if(m) openProposta(null, m.id); return; }
  if(a==="propAbrir"){ openProposta(el.dataset.p); return; }
  if(a==="propPdf"){ var p = D.propostas.filter(function(z){ return z.id===el.dataset.p; })[0]; if(p) propPreview(p); return; }
}

  out.sort(function(x,y){ return x.p-y.p || (x.v==="nao"?0:1)-(y.v==="nao"?0:1); });

var propLibsP = null;
function propLibs(){ if(!propLibsP) propLibsP = Promise.all(["vendor/html-to-image.js","vendor/pdf-lib.min.js"].map(function(src){ return new Promise(function(res, rej){ if(src.indexOf("html-to-image")>-1 && window.htmlToImage) return res(); if(src.indexOf("pdf-lib")>-1 && window.PDFLib) return res(); var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error("falha ao carregar "+src)); }; document.head.appendChild(s); }); })).catch(function(e){ propLibsP = null; throw e; }); return propLibsP; }
function propRender(p){
  var m = mentee(p.mid); if(!m) return Promise.reject(new Error("mentorado não encontrado"));
  return propLibs().then(function(){
    if(!$("ppCss")){ var st = document.createElement("style"); st.id = "ppCss"; st.textContent = PP_CSS; document.head.appendChild(st); }
    var stage = document.createElement("div"); stage.className = "ppstage"; stage.innerHTML = propPages(p, m).join(""); document.body.appendChild(stage);
    var imgs = Array.prototype.slice.call(stage.querySelectorAll("img"));
    return Promise.all(imgs.map(function(im){ return im.complete ? Promise.resolve() : new Promise(function(r){ im.onload = r; im.onerror = r; }); })).then(function(){
      var nodes = Array.prototype.slice.call(stage.querySelectorAll(".pp")), shots = [];
      var step = function(i){ if(i>=nodes.length) return Promise.resolve(); return window.htmlToImage.toCanvas(nodes[i], {pixelRatio:2, backgroundColor:"#ffffff", skipFonts:true, width:794, height:1123}).then(function(c){ shots.push(c); return step(i+1); }); };
      return step(0).then(function(){ stage.remove(); return shots; }, function(e){ stage.remove(); throw e; });
    });
  }).then(function(shots){
    var PL = window.PDFLib;
    return PL.PDFDocument.create().then(function(pdf){
      var urls = shots.map(function(c){ return c.toDataURL("image/jpeg", 0.88); });
      return urls.reduce(function(pr, u){ return pr.then(function(){ return pdf.embedJpg(u).then(function(img){ var pg = pdf.addPage([595.28, 841.89]); pg.drawImage(img, {x:0, y:0, width:595.28, height:841.89}); }); }); }, Promise.resolve()).then(function(){
        pdf.setTitle("Proposta "+(p.numero||"")+" - "+menteeName(m)); pdf.setAuthor("Framework da Gestão"); pdf.setCreator("Plataforma de Mentorias FWG");
        return pdf.save();
      }).then(function(bytes){ return {bytes:bytes, previews:urls}; });
    });
  });
}
function propPreview(p){
  var m = mentee(p.mid);
  openModal('<div class="dlg-h"><h3>Proposta '+esc(p.numero||"")+' · '+esc(menteeName(m))+'</h3><p id="ppMsg">Montando as páginas da proposta…</p></div><div class="dlg-b"><div class="ppview" id="ppView"><div class="ppload"></div></div></div><div class="dlg-f"><button class="btn" id="cNo" type="button">Fechar</button><div style="display:flex;gap:8px"><button class="btn" id="ppEdit" type="button">Editar proposta</button><button class="btn pri" id="ppDl" type="button" disabled>Baixar PDF</button></div></div>', function(){
    $("cNo").onclick = closeModal;
    $("ppEdit").onclick = function(){ closeModal(); openProposta(p.id); };
    propRender(p).then(function(out){
      if(!$("ppView")) return;
      $("ppView").innerHTML = out.previews.map(function(u, i){ return '<img src="'+u+'" alt="Página '+(i+1)+'">'; }).join("");
      $("ppMsg").textContent = out.previews.length+" páginas · confira e baixe o PDF.";
      var name = ("Proposta "+(p.numero||"")+" - "+menteeName(m)).replace(/[\\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim()+".pdf";
      $("ppDl").disabled = false;
      $("ppDl").onclick = function(){ var b = out.bytes; savePdf(b.buffer.slice(b.byteOffset, b.byteOffset+b.byteLength), name); };
    }, function(e){ if($("ppMsg")) $("ppMsg").textContent = "Não foi possível gerar a proposta: "+(e && e.message || e); });
  }, "wide");
}

function itemRow(v, ph){ return '<div class="item"><input class="inp" value="'+esc(v||"")+'" placeholder="'+esc(ph||"")+'"><button class="x" type="button" title="Remover">×</button></div>'; }

function readItems(id){ return Array.prototype.map.call($(id).querySelectorAll("input"), function(i){ return i.value.trim(); }).filter(Boolean); }

function drawerDirty(){
  if(drawerTid) return taskDirty();
  if(!drawerSid) return false;
  var s = D.sessoes.filter(function(z){ return z.id===drawerSid; })[0]; if(!s) return false;
  var st = $("dSt") && $("dSt").querySelector("button.on");
  var same = function(a,b){ return JSON.stringify(a||[])===JSON.stringify(b||[]); };
  return ($("dTit").value.trim()!==(s.titulo||"")) || ($("dData").value!==(s.data||"")) || ($("dHora").value!==(s.hora||"")) || ($("dFim").value!==horaFim(s)) ||
    ($("dLink").value.trim()!==(s.linkReuniao||"")) || ((st?st.dataset.v:"planejada")!==(s.status||"planejada")) || !same(readItems("dPauta"),s.pauta) || !same(readItems("dDisc"),s.temasDiscutidos) || !same(readItems("dExe"),s.temasExecutados) ||
    ($("dNotas").value!==(s.notas||"")) || ($("dPriv").value!==(s.notasPrivadas||"")) || ($("dFmt").value!==(s.formato==="presencial"?"presencial":"online"));
}

function parseBR(v){
  var s = String(v==null?"":v).replace(/[^\d.,-]/g,"");
  if(!s) return 0;
  if(s.indexOf(",")>-1) s = s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g,"");
  var n = parseFloat(s); return isNaN(n) ? 0 : n;
}
function brl2(n){ return "R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money2(n){ return (Math.round(n*100)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function contratoOf(mid){ return D.contratos.filter(function(c){ return c.id===mid; })[0] || null; }
function parcStatus(p){ if(p.status==="pago") return "pago"; if(p.venc && p.venc<todayISO()) return "atrasado"; return "pendente"; }
function finTotals(c){
  var t = {total: c ? parseBR(c.valorTotal) : 0, recebido:0, aReceber:0, atrasado:0, parcelado:0, prox:null};
  ((c && c.parcelas) || []).forEach(function(p){
    var v = parseBR(p.valor); t.parcelado += v;
    var st = parcStatus(p);
    if(st==="pago") t.recebido += v; else { t.aReceber += v; if(st==="atrasado") t.atrasado += v; else if(!t.prox || (p.venc||"9999")<(t.prox.venc||"9999")) t.prox = p; }
  });
  return t;
}

      '<td><input class="inp" type="date" data-f="pagoEm" value="'+esc(p.pagoEm||"")+'"'+(st==="pago"?"":" disabled")+'></td>'+
      '<td><select class="inp" data-f="forma"><option value="">—</option>'+FORMAS.map(function(f){ return '<option'+(p.forma===f?" selected":"")+'>'+f+'</option>'; }).join("")+'</select></td>'+

/* =========================================================
   Portal do mentorado: acesso por usuário e senha
   Os dados de cada mentorado são publicados criptografados
   (AES-GCM, chave derivada da senha com PBKDF2). Só quem tem a
   senha consegue ler o conteúdo.
   ========================================================= */
var PORTAL_URL = location.origin + "/";
var te = new TextEncoder(), td = new TextDecoder();
function b64(buf){ var s="", b=new Uint8Array(buf); for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
function normUser(u){ return String(u||"").trim().toLowerCase(); }
function shaHex(s){ return crypto.subtle.digest("SHA-256", te.encode(s)).then(function(h){ return Array.prototype.map.call(new Uint8Array(h), function(x){ return x.toString(16).padStart(2,"0"); }).join(""); }); }
function lookupOf(u){ return shaHex("fwg-portal:"+normUser(u)).then(function(h){ return h.slice(0,40); }); }
function deriveKey(pw, salt, extractable){
  return crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:210000, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, !!extractable, ["encrypt","decrypt"]);
